# ==========================
# Prefix: Ctrl-b (Standard)
# ==========================
unbind C-a
set -g prefix C-b
bind C-b send-prefix

# Ergonomics
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -s escape-time 0
set -g history-limit 50000

# Vi mode navigation & copy
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
# Standard Linux X11/Wayland clipboard fallback
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"

# TPM Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Auto-restore sessions on Tmux start
set -g @continuum-restore 'on'

run '~/.tmux/plugins/tpm/tpm'

# ----------------------
# Solarized Dark Palette
# ----------------------
# default statusbar colors
set -g status-style bg='#073642',fg='#839496'

# default window title colors
setw -g window-status-style fg='#839496',bg=default

# active window title colors
setw -g window-status-current-style fg='#b58900',bold,bg=default

# pane border
set -g pane-border-style fg='#073642'
set -g pane-active-border-style fg='#586e75'

# message text
set -g message-style bg='#073642',fg='#cb4b16'

# pane number display
set -g display-panes-active-colour '#268bd2'
set -g display-panes-colour '#b58900'

# clock
setw -g clock-mode-colour '#859900'

# status bar formatting
set -g status-left-length 30
set -g status-left '#[fg=#859900,bold]#S #[fg=#586e75]│ '
set -g status-right '#[fg=#586e75]│ #[fg=#268bd2]%Y-%m-%d %H:%M '

# Enable mouse support
set -g mouse on

# Keep selection highlighted and copy to system clipboard upon mouse release
# Uses OSC 52 / xclip depending on environment
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear "xclip -selection clipboard -in"
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-no-clear "xclip -selection clipboard -in"

# Ensure tmux always spawns zsh
set -g default-shell /bin/zsh

# ==========================================
# DOUBLE & TRIPLE CLICK SELECTION
# ==========================================
# Double-click: select word (Normal mode)
bind-key -n DoubleClick1Pane \
    select-pane \; \
    copy-mode -M \; \
    send-keys -X select-word

# Double-click: select word (Copy mode)
bind-key -T copy-mode-vi DoubleClick1Pane \
    select-pane \; \
    send-keys -X select-word

bind-key -T copy-mode DoubleClick1Pane \
    select-pane \; \
    send-keys -X select-word

# Triple-click: select line (Normal mode)
bind-key -n TripleClick1Pane \
    select-pane \; \
    copy-mode -M \; \
    send-keys -X select-line

# Triple-click: select line (Copy mode)
bind-key -T copy-mode-vi TripleClick1Pane \
    select-pane \; \
    send-keys -X select-line

bind-key -T copy-mode TripleClick1Pane \
    select-pane \; \
    send-keys -X select-line

# Cancel copy mode on single click
bind-key -T copy-mode-vi MouseDown1Pane select-pane \; send-keys -X cancel
bind-key -T copy-mode MouseDown1Pane select-pane \; send-keys -X cancel
